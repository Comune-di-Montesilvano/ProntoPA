name: Dusk (E2E)

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: dusk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dusk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, bcmath, gd, zip, intl, redis, ldap
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Dusk pilota un browser reale contro `php artisan serve` via HTTP: gli
      # serve un DB persistito su file, non lo sqlite :memory: di phpunit.xml
      # (quello vive solo dentro il processo di test, invisibile al server).
      - name: Configure env for Dusk (real HTTP server, not the phpunit sqlite :memory:)
        run: |
          touch database/database.sqlite
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=$(pwd)/database/database.sqlite"
            echo "MAIL_MAILER=log"
            echo "QUEUE_CONNECTION=sync"
            echo "CACHE_STORE=array"
            echo "SESSION_DRIVER=file"
          } >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install ChromeDriver matching the runner's Chrome
        run: php artisan dusk:chrome-driver --detect

      - name: Start ChromeDriver
        run: ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 &

      - name: Start app server
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Wait for app server
        run: npx wait-on http://127.0.0.1:8000/login --timeout 30000

      - name: Run Dusk tests
        env:
          APP_URL: http://127.0.0.1:8000
          DUSK_DRIVER_URL: http://localhost:9515
        run: php artisan dusk

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dusk-screenshots
          path: tests/Browser/screenshots

      - name: Upload console logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dusk-console
          path: tests/Browser/console

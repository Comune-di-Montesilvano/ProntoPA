name: Sicurezza
# Controlli di sicurezza a ogni PR e push su main, più un giro giornaliero (nuovi advisory
# su dipendenze invariate). I job sono required check nella branch protection: anche
# l'auto-merge Dependabot li aspetta, quindi un bump con CVE non arriva su main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Advisory delle dipendenze di produzione (dirette e transitive) dai database ufficiali
  # dei due ecosistemi: GitHub Advisory/FriendsOfPHP per composer, npm registry per npm.
  # composer audit blocca su qualsiasi severità; eccezioni motivate in composer.json
  # (config.audit.ignore).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: composer audit (prod)
        run: composer audit --locked --no-dev

      - name: npm audit (prod, HIGH+)
        run: npm audit --omit=dev --audit-level=high

  # CVE nei lockfile (composer + npm, anche dev: tooling di build), segreti committati e
  # misconfig dei Dockerfile. Eccezioni motivate e limitate per percorso in .trivyignore.yaml.
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Trivy filesystem (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # Senza, con format sarif l'action ignora `severity` ed exit-code scatta su tutto.
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Stesse immagini di release.yml, buildate dalla PR (nessun push) e scansionate prima del
  # merge: un bump Dependabot dell'immagine base o di una dipendenza con CVE non arriva su
  # main, invece di emergere solo nel rebuild notturno.
  trivy-image:
    # Nome stabile: è quello registrato come required check nella branch protection.
    name: trivy-image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: [app, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Data per APK_REFRESH
        id: day
        run: echo "apk_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Cache GHA di release.yml in sola lettura: nessuna scrittura da codice di una PR.
      - name: Build ${{ matrix.target }} (senza push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: scan/${{ matrix.target }}:pr
          build-args: |
            APK_REFRESH=${{ steps.day.outputs.apk_refresh }}
          cache-from: type=gha,scope=pronto-pa-${{ matrix.target }}

      - name: Trivy ${{ matrix.target }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: scan/${{ matrix.target }}:pr
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.target }}

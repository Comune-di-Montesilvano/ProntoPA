name: Build & Publish Docker Images

# dev branch  → build sempre, tag immagine: "dev"
# tag v*.*.* → build + tag semver + "latest"

on:
  push:
    branches:
      - dev
    tags:
      - "v*.*.*"

env:
  IMAGE_APP: ghcr.io/comune-di-montesilvano/pronto-pa
  IMAGE_WEB: ghcr.io/comune-di-montesilvano/pronto-pa-web

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute build config
        id: vars
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Metadata per entrambe le immagini ───────────────────────────────────

      - name: Docker metadata (app)
        id: meta-app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_APP }}
          bake-target: app
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_WEB }}
          bake-target: web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # ── Build & push entrambe le immagini in parallelo (bake) ───────────────
      # Builder stage gira una sola volta; app e web buildate in parallelo.
      # Cache scope separati per target (definiti in docker-bake.hcl).

      - name: Build & push (bake)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta-app.outputs.bake-file-tags }}
            cwd://${{ steps.meta-app.outputs.bake-file-labels }}
            cwd://${{ steps.meta-web.outputs.bake-file-tags }}
            cwd://${{ steps.meta-web.outputs.bake-file-labels }}
          push: true
          set: |
            app.args.APP_VERSION=${{ steps.vars.outputs.version }}
            web.args.APP_VERSION=${{ steps.vars.outputs.version }}
        env:
          PLATFORMS: linux/amd64

      # ── Scan immagini pubblicate — report-only, risultati su tab Security ──
      # Non blocca il push (già avvenuto): coglie CVE note per triage,
      # coerente col pattern trivy-fs bloccante già in tests.yml a monte.

      - name: Trivy scan (app image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: latest # il binario Trivy pinnato di default da questa release dell'action (0.69.1) non installa
          image-ref: ${{ env.IMAGE_APP }}:${{ steps.meta-app.outputs.version }}
          format: sarif
          output: trivy-app.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: latest # il binario Trivy pinnato di default da questa release dell'action (0.69.1) non installa
          image-ref: ${{ env.IMAGE_WEB }}:${{ steps.meta-web.outputs.version }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results (app) to Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always()
        with:
          sarif_file: trivy-app.sarif
          category: trivy-app

      - name: Upload Trivy results (web) to Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always()
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

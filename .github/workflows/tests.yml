name: Test

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, bcmath, gd, zip, intl, redis, ldap
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Static analysis (PHPStan/Larastan)
        run: composer run analyse

      - name: Run tests
        run: php artisan test

      # Scan bloccante su dipendenze composer/npm — coglie CVE note prima
      # ancora di arrivare al build immagine (che le scansiona di nuovo,
      # report-only, in release.yml).
      - name: Trivy scan filesystem dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0 # il default dell'action non installa; trivy-version-check.yml segnala le nuove release
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ${{ github.workspace }}/.trivyignore

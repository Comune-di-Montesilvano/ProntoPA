version: 2
# Ogni ecosistema: minor+patch in una sola PR, mergiata da sola a CI verde
# (dependabot-automerge.yml, che attende anche i controlli di security.yml). Le major
# restano PR singole, aperte come promemoria per l'upgrade manuale.
# Controllo giornaliero alle 01:00, così l'auto-merge chiude prima del rebuild giornaliero
# di latest (release.yml, 04:30 UTC).
# Cooldown: una release compromessa (malware in un pacchetto npm/composer o in una Action)
# nelle prime ore non ha advisory, quindi audit e Trivy non la vedono; di solito viene
# scoperta e ritirata in pochi giorni. 7 giorni (soglia della regola Semgrep
# dependabot-missing-cooldown), 14 sulle major (manuali). Sulle immagini Docker costa poco:
# il rebuild giornaliero rifà comunque `apk upgrade`. I security updates di Dependabot
# (attivi sul repo) non hanno cooldown: le correzioni di CVE arrivano subito.
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Immagini base FROM (fissate per digest): Dockerfile prod (php/composer/nginx) e dev
  # (docker/php). Il digest nuovo dello stesso tag arriva ogni volta che l'immagine
  # ufficiale viene ripubblicata con patch Alpine. Salti di php (8.4 → 8.5) li classifica
  # minor ma sono upgrade di runtime: l'auto-merge li esclude, restano manuali.
  - package-ecosystem: docker
    directories: ["/", "/docker/php"]
    schedule:
      interval: daily
      time: "01:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Servizi dello stack (mariadb, redis, nginx dev), fissati per digest. Cambi di
  # versione di mariadb/redis proposti ma mai auto-mergiati (sono dati), il solo digest sì.
  # ollama/clamav seguono tag mobili (latest/stable), niente da proporre.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
      timezone: Europe/Rome
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "ollama/ollama"
      - dependency-name: "clamav/clamav"
      - dependency-name: "axllent/mailpit"
      # Dependabot non distingue LTS da rolling (proporrebbe 12.4, 13.0…): le nuove LTS le
      # segnala mariadb-lts-check.yml con una issue. Il digest della 12.3 resta aggiornato.
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

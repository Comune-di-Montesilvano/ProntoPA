; Dev override: rileggi i file ad ogni richiesta invece di tenerli in cache
; per sempre. Senza questo, ogni modifica a un file PHP richiede il riavvio
; del container (docker compose restart php) per essere visibile.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
opcache.validate_timestamps=1

# docker-compose.override.yml — SVILUPPO LOCALE
#
# Caricato automaticamente da Docker Compose sopra docker-compose.yml.
# Sovrascrive immagini con build locale, aggiunge bind mount e tool dev.
#
# Avvio: docker compose up -d
# Con Adminer e Mailpit: docker compose --profile dev up -d

services:

  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./:/var/www/html
      - ./public/storage:/var/www/html/public/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    restart: "no"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: pronto-pa-dev:local
    volumes:
      - ./:/var/www/html
      - dev_vendor:/var/www/html/vendor
      - dev_node_modules:/var/www/html/node_modules
      - ./storage:/var/www/html/storage
      - ./public/storage:/var/www/html/public/storage
      - ./backups:/var/www/html/backups
      - ./docker/php/opcache-dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    restart: "no"

  # Stesso build locale del servizio "php" — altrimenti tenterebbero di
  # scaricare l'immagine GHCR di produzione (rete + codice disallineato).
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: pronto-pa-dev:local
    # queue:listen invece di queue:work --max-time: non esce dopo un'ora (in dev
    # restart "no" non lo riavvierebbe) e ricarica il codice a ogni job.
    command: php artisan queue:listen --tries=3 --backoff=30,120 --sleep=3
    volumes:
      - ./:/var/www/html
      - dev_vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage
      - ./public/storage:/var/www/html/public/storage
      - ./backups:/var/www/html/backups
    restart: "no"

  queue-lunghi:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: pronto-pa-dev:local
    command: php artisan queue:listen redis-lunghi --queue=lunghi --force --tries=1 --timeout=7200 --sleep=3
    volumes:
      - ./:/var/www/html
      - dev_vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage
      - ./public/storage:/var/www/html/public/storage
      - ./backups:/var/www/html/backups
    restart: "no"

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: pronto-pa-dev:local
    volumes:
      - ./:/var/www/html
      - dev_vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage
      - ./public/storage:/var/www/html/public/storage
      - ./backups:/var/www/html/backups
    restart: "no"

  mariadb:
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    restart: "no"

  redis:
    restart: "no"

  adminer:
    image: adminer:6
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - mariadb
    networks:
      - prontoPA
    profiles:
      - dev

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - prontoPA
    profiles:
      - dev

  ollama:
    ports:
      - "11434:11434"
    restart: "no"

  clamav:
    ports:
      - "3310:3310"
    restart: "no"

# vendor/ e node_modules/ restano dentro Linux, non sul disco host: con il bind
# mount da Windows (WSL2) ogni file letto attraversa il ponte e una pagina
# Laravel, che carica centinaia di file da vendor/, impiegava ~5 s.
# Dopo il primo avvio (o un nuovo volume): composer install e npm ci nel container.
volumes:
  dev_vendor:
  dev_node_modules:
